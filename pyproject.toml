[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "0.1.0"
description = "Local-first AWS DevOps assistant with infrastructure knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
devops-agent = "devops_agent.cli:app"

[project.optional-dependencies]
dev = [
    "boto3-stubs[essential]>=1.35.0",
    "moto[all]>=5.0.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
