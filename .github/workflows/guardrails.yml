name: guardrails
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify guardrail file checksums
        run: ./scripts/guardrails.sh verify
      - name: Run guard hook test suite
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/unit/test_guardrails.py -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the diff
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
